function updateStruct(id,key,val,ix){let s=state.structures.find(x=>x.id===id);if(!s)return;if(key==='poles')s.poles[ix]=Math.round(nval(val));else if(key==='men')s.men=Math.round(nval(val));else if(['epi','epc'].includes(key))s[key]=val==='SIM';else s[key]=val;state.audit.unshift({date:new Date().toLocaleString('pt-BR'),action:`Estrutura ${s.name}: ${key} alterado`});save()}

function structSelect(id,key){return function(v){updateStruct(id,key,v)}}function newStructure(){const name=prompt('Nome da nova estrutura');if(!name)return;const type=prompt('Código de tipo (ex.: PL 8H). Para tipo novo, inclua regras de vida útil e aplicabilidade nos itens:', 'PL 8H');if(!type)return;state.structures.push({id:Date.now(),name,area:'STC',epi:true,epc:true,type,men:1,poles:[0,0,0,0,0],special:/FERT|FIS/.test(type)});if(!TYPES.includes(type)){notify('Novo tipo: as regras de vida útil precisam ser configuradas.');}save()}

function aggregate(rows,yr,whichArea=area){let total={gross:0,net:0,value:0,final:0,finalValue:0,stcNet:0,gomNet:0,stcValue:0,gomValue:0,stcGross:0,gomGross:0};for(const r of rows){let y=r.years[yr-1];let factor=whichArea==='ALL'?1:0;let gross=whichArea==='ALL'?y.gross:y[whichArea.toLowerCase()+'Gross'];let net=whichArea==='ALL'?y.net:y[whichArea.toLowerCase()+'Net'];total.gross+=gross;total.net+=net;total.value+=net*r.item.price;total.final+=whichArea==='ALL'?y.final:Math.ceil(net*(1-y.discount/100));total.finalValue+=whichArea==='ALL'?y.finalValue:Math.ceil(net*(1-y.discount/100))*r.item.price;total.stcNet+=y.stcNet;total.gomNet+=y.gomNet;total.stcValue+=y.stcNet*r.item.price;total.gomValue+=y.gomNet*r.item.price;total.stcGross+=y.stcGross;total.gomGross+=y.gomGross}return total}

// Resumo regional: redistribui as partes já calculadas, preservando exatamente o estoque abatido por estrutura.
const REGIONAL_NAMES=['Metropolitana','Porto Grande','Tartarugalzinho','Laranjal do Jari','Oiapoque'];
const REGIONAL_COLORS=['#064af8','#00bfa6','#ff941f','#773af6','#ffd132'];
function regionalParts(r,y){
 const yy=r.years[y-1],out=POLES.map(()=>({gross:0,net:0,value:0,stc:0,gom:0}));
 yy.parts.forEach(part=>{
  const st=state.structures.find(s=>s.id===part.structure);if(!st||!part.q||!allowedArea(st.area)||(regionalTypeSelections!==null&&!regionalTypeSelections.includes(st.type)))return;
  const ix=TYPES.indexOf(st.type),life=Number(r.item.lives[ix]);if(!(life>0))return;
  const times=Math.max(0,Math.ceil(y*12/life)-Math.ceil((y-1)*12/life));
  const byPole=st.poles.map(n=>Math.max(0,Number(n)||0)*times*(r.item.kind==='EPI'&&!st.special?st.men:1));
  // A dedução da estrutura foi calculada antes; reparti-la por polo na ordem oficial das colunas.
  let remaining=part.q-part.net;
  byPole.forEach((q,k)=>{let taken=Math.min(q,remaining);remaining-=taken;let net=q-taken;out[k].gross+=q;out[k].net+=net;out[k].value+=net*r.item.price;out[k][st.area.toLowerCase()]+=net;});
 });return out;
}
function regionalTotals(rows,ys){let totals=POLES.map(()=>({gross:0,net:0,value:0,years:[1,2,3,4,5].map(()=>({gross:0,net:0,value:0}))}));
 for(const r of rows)for(const y of ys){const vals=regionalParts(r,y);vals.forEach((v,k)=>{totals[k].gross+=v.gross;totals[k].net+=v.net;totals[k].value+=v.value;for(const key of ['gross','net','value'])totals[k].years[y-1][key]+=v[key]})}return totals;
}
function regionalFilteredRows(){return scopeRows().filter(r=>state.structures.some(s=>allowedArea(s.area)&&(regionalTypeSelections===null||regionalTypeSelections.includes(s.type))&&s.poles.some((n,k)=>n>0&&regionalPoleSelections.includes(POLES[k]))&&r.item.uses[TYPES.indexOf(s.type)]));}

function renderRegional(){const {rows,ys,poles,totals}=regionalView(),pg=paging(rows),grand=sum(poles.map(k=>totals[k].value)),fmt=v=>Number(v).toLocaleString('pt-BR',{maximumFractionDigits:0});
 const opts=[['ALL','Todas'],...POLES.map((p,k)=>[p,REGIONAL_NAMES[k]])];
 const top= `<div class="toolbar">${multiChoice('Regional',POLES,regionalPoleSelections,'regionalPole')}${multiChoice('Área',['STC','GOM'],areaSelections,'area')}${field('Ano',sel([['ALL','Todos os anos'],...[1,2,3,4,5].map(y=>[y,'Ano '+y+' ('+(state.startYear+y-1)+')'])],year,'setYear'))}${multiChoice('Tipo (Estrutura)',TYPES,regionalTypeSelections,'regionalType')}${multiChoice('Tipo do item',['EPI','EPC','FERR'],kindSelections,'kind')}${field('Buscar item',`<input value="${escapeHTML(filter)}" data-search-filter="1" oninput="setFilter(this.value)" placeholder="SAP ou descrição">`)}<button class="btn alt" onclick="resetRegionalFilters()">Limpar filtros</button><button class="btn" onclick="exportRegional()">⬇ Exportar Excel</button></div>`;
 const bar=grand>0?poles.map(k=>`<div class="region-legend"><span class="region-dot" style="background:${REGIONAL_COLORS[k]}"></span><span>${REGIONAL_NAMES[k]}</span><b>${(totals[k].value/grand*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}%</b></div>`).join(''):'Sem valores no filtro';
 let cumulative=0;const stops=poles.map(k=>{let a=cumulative;cumulative+=grand?totals[k].value/grand*100:0;return `${REGIONAL_COLORS[k]} ${a}% ${cumulative}%`});
 const ring=`<div class="region-ring" style="background:conic-gradient(${stops.join(',')||'#e7ebfa 0 100%'})"><div class="region-center">${money(grand)}<small>Valor líquido</small></div></div>`;
 const regionRows=poles.map(k=>`<tr><td>${REGIONAL_NAMES[k]}</td>${ys.map(y=>`<td class="num">${integer(totals[k].years[y-1].net)}</td>`).join('')}<td class="num"><b>${integer(totals[k].net)}</b></td>${ys.map(y=>`<td class="num">${money(totals[k].years[y-1].value)}</td>`).join('')}<td class="num"><b>${money(totals[k].value)}</b></td></tr>`).join('');
 const yearly=ys.map(y=>({net:sum(poles.map(k=>totals[k].years[y-1].net)),value:sum(poles.map(k=>totals[k].years[y-1].value))}));
 const summary=`<div class="regional-overview"><div class="panel"><b>Distribuição do Valor por Regional</b><div class="regional-chart">${ring}<div>${bar}</div></div></div><div class="tablewrap regional-summary"><table><thead><tr><th rowspan="2">Regional</th><th colspan="${ys.length+1}">Compra Líquida (un.)</th><th colspan="${ys.length+1}">Valor Líquido (R$)</th></tr><tr>${ys.map(y=>`<th>Ano ${y}<small>${state.startYear+y-1}</small></th>`).join('')}<th>Total</th>${ys.map(y=>`<th>Ano ${y}<small>${state.startYear+y-1}</small></th>`).join('')}<th>Total</th></tr></thead><tbody>${regionRows}</tbody><tfoot><tr><th>TOTAL</th>${yearly.map(v=>`<th class="num">${integer(v.net)}</th>`).join('')}<th>${integer(sum(poles.map(k=>totals[k].net)))}</th>${yearly.map(v=>`<th class="num">${money(v.value)}</th>`).join('')}<th>${money(grand)}</th></tr></tfoot></table></div></div>`;
 const showQty=regionalDisplay!=='VALUE',showValue=regionalDisplay!=='QTY';
 const itemRows=pg.slice.map(r=>{const vals=ys.map(y=>regionalParts(r,y));return `<tr><td class="sticky1">${escapeHTML(r.item.sap)}</td><td class="sticky2">${escapeHTML(r.item.desc)}</td><td>${escapeHTML(r.item.kind)}</td><td class="num">${money(r.item.price)}</td>${poles.map(k=>{const q=sum(vals.map(v=>v[k].net)),v=sum(vals.map(a=>a[k].value));return `${showQty?`<td class="num">${integer(q)}</td>`:''}${showValue?`<td class="num">${money(v)}</td>`:''}`}).join('')}${showQty?`<td class="num"><b>${integer(sum(poles.map(k=>sum(vals.map(v=>v[k].net)))))}</b></td>`:''}${showValue?`<td class="num"><b>${money(sum(poles.map(k=>sum(vals.map(v=>v[k].value)))))}</b></td>`:''}</tr>`}).join('');
 const table=`<div class="toolbar">${field('Colunas do detalhamento',sel([['ALL','Quantidade e Valor'],['QTY','Somente Quantidade'],['VALUE','Somente Valor']],regionalDisplay,'setRegionalDisplay'))}<span class="muted">O detalhamento considera ${ys.length===5?'os 5 anos':'o ano selecionado'} e os filtros ativos.</span></div><div class="tablewrap"><table><thead><tr><th class="sticky1">SAP</th><th class="sticky2">Descrição do item</th><th>Tipo</th><th>Valor unit. (R$)</th>${poles.map(k=>`<th colspan="${Number(showQty)+Number(showValue)}">${REGIONAL_NAMES[k]}</th>`).join('')}<th colspan="${Number(showQty)+Number(showValue)}">Total geral</th></tr><tr><th colspan="4">Itens filtrados</th>${[...poles,-1].map(()=>`${showQty?'<th>Qtd.</th>':''}${showValue?'<th>Valor (R$)</th>':''}`).join('')}</tr></thead><tbody>${itemRows}</tbody></table></div>${pg.footer}`;
 return `<div class="panel">${top}${summary}${table}<p class="foot">Quantidades e valores oficiais após abatimento do estoque. A alocação regional segue as estruturas por polo e a ordem de abatimento já aplicada no cálculo do sistema. Não inclui abatimentos percentuais da tela Gerencial.</p></div>`;
}

function exportRegional(){if(!window.XLSX){notify('Biblioteca Excel indisponível. Verifique a conexão.');return}const {rows,ys,poles,totals}=regionalView(),wb=XLSX.utils.book_new();const summary=poles.map(k=>({'Regional':REGIONAL_NAMES[k],...Object.fromEntries(ys.flatMap(y=>[[`Qtd Ano ${y}`,totals[k].years[y-1].net],[`Valor Ano ${y}`,totals[k].years[y-1].value]])),'Qtd Total':totals[k].net,'Valor Total':totals[k].value}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary),'Resumo Regional');const detail=rows.map(r=>{let vals=ys.map(y=>regionalParts(r,y));let obj={'SAP':r.item.sap,'Descrição':r.item.desc,'Tipo':r.item.kind,'Valor Unitário':r.item.price};poles.forEach(k=>{if(regionalDisplay!=='VALUE')obj[`${REGIONAL_NAMES[k]} Qtd`]=sum(vals.map(v=>v[k].net));if(regionalDisplay!=='QTY')obj[`${REGIONAL_NAMES[k]} Valor`]=sum(vals.map(v=>v[k].value))});return obj});XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(detail),'Itens por Regional');XLSX.writeFile(wb,'resumo_por_regional_epi_epc.xlsx')}

in('')}</tbody><tfoot><tr><th>TOTAL</th>${['gross','net','value','stcGross','gomGross','gross'].map(k=>`<th class="num">${k==='value'?money(sum(totals.map(t=>t[k]))):integer(sum(totals.map(t=>t[k])))}</th>`).join('')}<th>—</th></tr></tfoot></table></div><p class="foot">A quantidade líquida considera estoque único por item, abatido cronologicamente. Os valores STC/GOM seguem a alocação por estrutura.</p><div class="toolbar"><button class="btn" onclick="exportData()">Exportar Excel</button><button class="btn" onclick="window.print()">Exportar PDF / Imprimir</button></div></div>`}

function stockCode(value){let s=String(value??'').trim();if(/^\d+(?:[.,]0+)?$/.test(s))return s.replace(/[.,]0+$/,'');if(/^\d+(?:[.,]\d+)?e\+?\d+$/i.test(s)){let n=Number(s.replace(',','.'));return Number.isSafeInteger(n)?String(n):s}return s}
function stockQty(value){if(typeof value==='number')return value;let s=String(value??'').trim().replace(/\s/g,'');if(!s)return NaN;if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return Number(s)}
function stockRowsFromSheet(ws){let matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});let idx=matrix.findIndex(row=>row.some(v=>/^(COD\s*MAT|COD[_ ]?MATERIAL|SAP|C[ÓO]DIGO)$/i.test(String(v).trim())));if(idx<0)throw Error('Cabeçalho COD MAT/SAP não encontrado. Confira a primeira aba do Excel.');let heads=matrix[idx].map(v=>String(v).trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,''));let c=heads.findIndex(v=>['CODMAT','CODMATERIAL','SAP','CODIGO'].includes(v));let q=heads.findIndex(v=>['QTD','QUANTIDADE','QTDE','ESTOQUE','QTDATUAL'].includes(v));if(q<0)throw Error('Coluna QTD não encontrada. O Excel precisa ter COD MAT, DESCRIÇÃO e QTD.');return matrix.slice(idx+1).map((row,k)=>({sap:stockCode(row[c]),q:stockQty(row[q]),line:idx+k+2})).filter(r=>r.sap!==''||Number.isFinite(r.q))}
function stockRowsFromCSV(text){let first=text.replace(/^\uFEFF/,'').split(/\r?\n/).find(Boolean)||'';let delimiter=[';',',','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];let lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());let rows=lines.map(line=>{let result=[],cur='',quoted=false;for(let j=0;j<line.length;j++){let c=line[j];if(c==='"'){if(quoted&&line[j+1]==='"'){cur+='"';j++}else quoted=!quoted}else if(c===delimiter&&!quoted){result.push(cur);cur=''}else cur+=c}result.push(cur);return result});let heads=rows[0].map(x=>x.trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,''));let c=heads.findIndex(v=>['CODMAT','CODMATERIAL','SAP','CODIGO'].includes(v)),q=heads.findIndex(v=>['QTD','QUANTIDADE','QTDE','ESTOQUE','QTDATUAL'].includes(v));if(c<0||q<0)throw Error('CSV deve conter as colunas COD MAT e QTD.');return rows.slice(1).map((r,k)=>({sap:stockCode(r[c]),q:stockQty(r[q]),line:k+2})).filter(r=>r.sap!==''||Number.isFinite(r.q))}
function importStock(){openFile(file=>{let ext=file.name.split('.').pop().toLowerCase();if(!['xlsx','xls','csv'].includes(ext)){alert('Selecione um arquivo .xlsx, .xls ou .csv');return}const reader=new FileReader();reader.onerror=()=>alert('Falha na leitura do arquivo.');reader.onload=()=>{try{let rows;if(ext==='csv')rows=stockRowsFromCSV(String(reader.result));else{if(!window.XLSX)throw Error('Leitor Excel indisponível. Verifique sua conexão à internet ou salve a planilha como CSV (separado por ponto e vírgula).');let wb=XLSX.read(reader.result,{type:'array'});rows=stockRowsFromSheet(wb.Sheets[wb.SheetNames[0]])}let seen=new Map(),dups=[],bad=[];for(let r of rows){if(!r.sap)continue;if(seen.has(r.sap))dups.push(r.sap);if(!Number.isInteger(r.q)||r.q<0)bad.push(`${r.sap} (linha ${r.line})`);seen.set(r.sap,r.q)}let known=new Set(state.items.map(i=>stockCode(i.sap))),unknown=[...seen.keys()].filter(k=>!known.has(k)),matches=state.items.filter(i=>seen.has(stockCode(i.sap))).length;let detail=`Linhas lidas: ${rows.length}\nMateriais identificados: ${matches}\nCódigos não cadastrados: ${unknown.length}\nDuplicados: ${dups.length}\nQuantidades inválidas: ${bad.length}`;if(dups.length||bad.length){alert(detail+'\n\nCorrija antes de importar.\nDuplicados: '+dups.slice(0,8).join(', ')+'\nInválidos: '+bad.slice(0,8).join(', '));return}if(!matches){alert(detail+'\n\nNenhum código SAP corresponde ao cadastro. Confira os códigos e a formatação.');return}let choice=prompt(detail+'\n\nDigite 1 = atualizar somente os itens encontrados (recomendado).\nDigite 2 = substituir estoque completo e zerar os ausentes.\nCancelar = não importar.','1');if(choice!=='1'&&choice!=='2')return;if(choice==='2'&&!confirm('Confirma zerar o estoque dos materiais ausentes do arquivo?'))return;state.items.forEach(i=>{let key=stockCode(i.sap);if(seen.has(key))i.stock=seen.get(key);else if(choice==='2')i.stock=0});state.stockDate=new Date().toLocaleString('pt-BR');state.audit.unshift({date:state.stockDate,action:`Estoque importado: ${matches} encontrados, ${unknown.length} não cadastrados; modo ${choice==='1'?'parcial':'completo'}`});save();alert(`Importação concluída!\n${detail}${unknown.length?'\nCódigos não cadastrados (amostra): '+unknown.slice(0,12).join(', '):''}`)}catch(e){alert('Não foi possível importar o estoque:\n'+e.message)}};if(ext==='csv')reader.readAsText(file,'UTF-8');else reader.readAsArrayBuffer(file)})}

function restore(){openFile(file=>{let rd=new FileReader();rd.onload=()=>{try{let data=JSON.parse(rd.result);if(!Array.isArray(data.items)||!Array.isArray(data.structures))throw Error('Formato inválido');if(confirm('Restaurar backup e substituir dados atuais?')){state=data;save()}}catch(e){notify('JSON inválido: '+e.message)}};rd.readAsText(file)})}
function importFull(){notify('Para carregar os dados oficiais, use o backup JSON; a importação Excel aqui está reservada ao estoque.');importStock()}
function exportData(){if(window.XLSX){let wb=XLSX.utils.book_new();let sheets=[['ESTRUTURAS',state.structures.map(s=>({'ESTRUTURA':s.name,'ÁREA':s.area,'EPI':s.epi?'SIM':'NÃO','EPC':s.epc?'SIM':'NÃO','TIPO':s.type,'HOM EQP':s.men,...Object.fromEntries(POLES.map((p,i)=>[p,s.poles[i]])),'TOTAL EQP':totalTeams(s),'TOTAL HOMENS':totalMen(s)}))],['ITENS E REGRAS',state.items.map(i=>({'SAP':i.sap,'DESCRIÇÃO':i.desc,'TIPO':i.kind,'VIDA REF':i.life,'PREÇO':i.price,'ESTOQUE':i.stock,...Object.fromEntries(TYPES.map((t,k)=>['VIDA '+t,i.lives[k]])),...Object.fromEntries(TYPES.map((t,k)=>['USA '+t,i.uses[k]?'OK':'-']))}))],['PROJECAO 5 ANOS',calculated.map(r=>({'SAP':r.item.sap,'DESCRIÇÃO':r.item.desc,...Object.fromEntries(r.years.flatMap((v,i)=>[[`BRUTO ANO ${i+1}`,v.gross],[`LÍQUIDO ANO ${i+1}`,v.net],[`VALOR ANO ${i+1}`,v.value]]))}))],['GERENCIAL',calculated.map(r=>({'SAP':r.item.sap,'DESCRIÇÃO':r.item.desc,...Object.fromEntries(r.years.flatMap((v,i)=>[[`ABATIMENTO ANO ${i+1} %`,v.discount],[`COMPRA FINAL ANO ${i+1}`,v.final],[`VALOR FINAL ANO ${i+1}`,v.finalValue]]))}))]];sheets.forEach(([name,rows])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),name));XLSX.writeFile(wb,'planejamento_epi_epc.xlsx')}else notify('Excel requer conexão para carregar a biblioteca. Backup JSON está disponível.')}

// Ordenação visual em todas as tabelas: clique no cabeçalho para alternar crescente/decrescente.
// Ao ordenar uma tabela paginada, exibe todos os registros filtrados para ordenar o conjunto inteiro.
let tableSort=null;
function tableCellValue(cell){
  const control=cell.querySelector('input,select');
  return (control ? control.value : cell.textContent).trim();
}
function sortValue(raw){
  const v=String(raw||'').trim();
  if(!v)return {type:'empty',value:''};
  // Códigos SAP são textos para preservar zeros à esquerda; quantidades, percentuais e moeda são numéricos.
  let cleaned=v.replace(/\s/g,'').replace(/R\$/gi,'').replace(/%/g,'');
  if(/^[-+]?\d{1,3}(?:\.\d{3})*(?:,\d+)?$/.test(cleaned))return {type:'number',value:Number(cleaned.replace(/\./g,'').replace(',','.'))};
  if(/^[-+]?\d+(?:[.,]\d+)?$/.test(cleaned))return {type:'number',value:Number(cleaned.replace(',','.'))};
  return {type:'text',value:v.toLocaleLowerCase('pt-BR')};
}
function sortVisibleTable(table,index,direction){
  const body=table.tBodies[0];if(!body)return;
  const rows=Array.from(body.rows);
  rows.sort((a,b)=>{
    const x=sortValue(tableCellValue(a.cells[index]||a.cells[0]));
    const y=sortValue(tableCellValue(b.cells[index]||b.cells[0]));
    if(x.type==='empty'&&y.type!=='empty')return 1;
    if(y.type==='empty'&&x.type!=='empty')return -1;
    let d=(x.type==='number'&&y.type==='number')?x.value-y.value:String(x.value).localeCompare(String(y.value),'pt-BR',{numeric:true,sensitivity:'base'});
    return d*direction;
  });
  rows.forEach(r=>body.appendChild(r));
}
function enableTableSorting(){
  const tables=Array.from(document.querySelectorAll('#app table'));
  tables.forEach((table,tableIndex)=>{
    const head=table.tHead;if(!head||!table.tBodies.length)return;
    const headers=Array.from(head.rows[0]?.cells||[]);
    headers.forEach((th,index)=>{
      if(/^(ações|ação)$/i.test(th.textContent.trim()))return;
      th.style.cursor='pointer';th.style.userSelect='none';th.title='Ordenar por esta coluna (clique novamente para inverter)';
      th.setAttribute('role','button');th.tabIndex=0;
      const activate=()=>{
        let dir=(tableSort&&tableSort.page===page&&tableSort.tableIndex===tableIndex&&tableSort.index===index)?-tableSort.dir:-1;
        tableSort={page,tableIndex,index,dir};
        if(pageSize<state.items.length && ['itens','estoque','projecao','gerencial'].includes(page)){
          pageSize=Math.max(state.items.length,167);pageNum=1;render();return;
        }
        sortVisibleTable(table,index,dir);
        headers.forEach(h=>h.classList.remove('sorted-column'));
        th.classList.add('sorted-column');
        th.setAttribute('aria-sort',dir===1?'ascending':'descending');
      };
      th.addEventListener('click',activate);
      th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}});
    });
    if(tableSort&&tableSort.page===page&&tableSort.tableIndex===tableIndex){
      const th=headers[tableSort.index];
      if(th){sortVisibleTable(table,tableSort.index,tableSort.dir);th.classList.add('sorted-column');th.setAttribute('aria-sort',tableSort.dir===1?'ascending':'descending')}
    }
  });
}
function exportManagerFiltered(){
  if(!window.XLSX){alert('A biblioteca de Excel não carregou. Verifique a conexão com a internet.');return}
  const table=document.querySelector('#app .tablewrap table');
  if(!table){alert('Tabela gerencial não encontrada.');return}
  const headers=Array.from(table.tHead.rows[0].cells).map(c=>c.textContent.trim());
  // Exporta todo o conjunto filtrado, mesmo se a visualização estiver paginada.
  // Preserva a ordem de classificação escolhida pelo usuário.
  const oldSize=pageSize,oldPage=pageNum;
  const sorted=tableSort&&tableSort.page===page?{...tableSort}:null;
  pageSize=Math.max(167,state.items.length);pageNum=1;render();
  const fullTable=document.querySelector('#app .tablewrap table');
  const values=Array.from(fullTable.tBodies[0].rows).map(tr=>Array.from(tr.cells).map(tableCellValue));
  const aoa=[headers,...values];
  const sheet=XLSX.utils.aoa_to_sheet(aoa);
  sheet['!cols']=headers.map((h,i)=>({wch:i===1?55:Math.min(28,Math.max(14,h.length+2))}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheet,'GERENCIAL FILTRADO');
  XLSX.writeFile(wb,`gerencial_filtrado_${year==='ALL'?'5_anos':'ano_'+year}.xlsx`);
  pageSize=oldSize;pageNum=oldPage;tableSort=sorted;render();
}

render();
